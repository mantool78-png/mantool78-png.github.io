name: Обновить цифры

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh.yml"
      - "server.py"
      - "collect.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Повтор старого запуска иначе забирает его SHA, и push цифр
          # отклоняется как non-fast-forward.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Снять цифры
        env:
          TZ: Asia/Yekaterinburg
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: bash .github/scripts/collect_stats.sh
      - name: Сохранить цифры
        env:
          TZ: Asia/Yekaterinburg
        run: python .github/scripts/publish_stats.py
      - name: Следующий съём через 15 минут
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Yekaterinburg
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: bash .github/scripts/dispatch_next.sh
